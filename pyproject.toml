[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowctl"
version = "0.1.0"
description = "A small, local Python task orchestrator: dependency-aware pipelines, retries, scheduling, and a monitoring dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "p1_manaverm" }]
keywords = ["orchestration", "pipeline", "scheduler", "task-runner", "dag", "automation", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "sqlalchemy>=2.0",
    "croniter>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/Manav66/Orchestrator"

[project.scripts]
flowctl = "flowctl.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/flowctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
