<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}flowctl{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="dot"></span> flowctl</div>
      <nav class="nav">
        <a href="/" class="{{ 'active' if active_page == 'overview' else '' }}">Overview</a>
        <a href="/runs" class="{{ 'active' if active_page == 'runs' else '' }}">All Runs</a>
      </nav>
      <div class="sidebar-footer">
        <a class="btn primary block" href="/jobs/new">+ New Job</a>
      </div>
    </aside>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </div>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
